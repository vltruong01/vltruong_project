app = "vlt-chatbot"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  strategy = "immediate"

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "60s"
    grace_period = "60s"
    method       = "GET"
    path         = "/health"
    protocol     = "http"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512

[env]
  KNOWLEDGE_DIR = "data/knowledge"
  EMBED_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
  TOP_K = "4"
